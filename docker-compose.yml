services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://crisiscore:crisiscore@db:5432/crisiscore
      - DATABASE_URL_SYNC=postgresql://crisiscore:crisiscore@db:5432/crisiscore
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=crisiscore-dev-secret-change-in-prod
      - NOTIFICATION_PROVIDER=console
      - AUTO_REASSIGN_MINUTES=5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: crisiscore
      POSTGRES_USER: crisiscore
      POSTGRES_PASSWORD: crisiscore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisiscore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
