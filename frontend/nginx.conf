server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://api:8000/;
    }
    location /health {
        proxy_pass http://api:8000/health;
    }
    location /auth/ {
        proxy_pass http://api:8000/auth/;
    }
    location /incidents {
        proxy_pass http://api:8000/incidents;
    }
}
